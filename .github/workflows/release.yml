name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build SEA executable
        run: npm run build:sea

      - name: Package Windows distribution
        shell: powershell
        run: Compress-Archive -Path dist\diskit-dist\* -DestinationPath diskit-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: diskit-windows
          path: diskit-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build SEA executable
        run: npm run build:sea

      - name: Package Linux distribution
        run: zip -j diskit-linux.zip dist/diskit-dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: diskit-linux
          path: diskit-linux.zip

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: diskit-windows

      - uses: actions/download-artifact@v8
        with:
          name: diskit-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            diskit-windows.zip
            diskit-linux.zip
